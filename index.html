<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager - Vanilla JS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen py-12 px-4 text-slate-800">

    <main class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
        <header class="flex justify-between items-center border-b border-slate-100 pb-4">
            <h1 class="text-xl font-bold text-slate-900">Task Manager</h1>
            <span id="task-count" class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded-full font-medium">残り 0
                件</span>
        </header>

        <!-- 入力フォーム -->
        <form id="todo-form" class="flex gap-2">
            <input type="text" id="todo-input" placeholder="新しいタスクを入力..." required
                class="flex-1 px-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <button type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                追加
            </button>
        </form>

        <!-- フィルタボタン -->
        <div class="flex gap-2 text-xs">
            <button type="button" data-filter="all"
                class="filter-btn bg-slate-800 text-white px-3 py-1.5 rounded-md font-medium">すべて</button>
            <button type="button" data-filter="active"
                class="filter-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-md font-medium">未完了</button>
            <button type="button" data-filter="completed"
                class="filter-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-md font-medium">完了済</button>
        </div>

        <!-- タスクリスト -->
        <ul id="todo-list" class="space-y-2"></ul>
    </main>

    <!-- JavaScriptファイル読み込み -->
    <script src="app.js"></script>
</body>

</html>
